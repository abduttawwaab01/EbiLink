name = "ebilink"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "ebilink-family-db"
database_id = "your-d1-database-id-here"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "ebilink-family-uploads"
preview_bucket_name = "ebilink-preview-uploads"
